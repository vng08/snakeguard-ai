name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint and Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://snakeguard:snakeguard@localhost:5432/snakeguard
      LLM_PROVIDER: groq
      LLM_API_KEY: test-key
      LLM_MODEL: test-model
      TAVILY_API_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check backend frontend ml scripts tests

      - name: Run Pytest
        run: pytest -q

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t snakeguard-backend:test .

      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile -t snakeguard-frontend:test .
