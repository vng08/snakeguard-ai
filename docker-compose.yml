services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: snakeguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: snakeguard
      POSTGRES_PASSWORD: snakeguard
      POSTGRES_DB: snakeguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: